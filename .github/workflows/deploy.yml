name: Deploy to TestFlight

on:
  push:
    branches:
      - develop         # develop 머지 시 QA용 TestFlight 배포 (내부 전용 빌드)
      - 'release/**'    # QA 브랜치 수정사항 재검증용 TestFlight 배포 (내부 전용 빌드)
    tags:
      - 'v*.*.*'        # main의 릴리스 태그 push 시 심사용 빌드 배포

  # 수동 배포 또는 재시도용
  workflow_dispatch:
    inputs:
      lane:
        description: "실행할 Fastlane 레인"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - release

# build/* 태그를 push하기 위해 필요합니다.
permissions:
  contents: write

# 빌드 번호 레이스를 방지하기 위해 업로드를 직렬화합니다.
# bump_version이 latest_testflight_build_number + 1 방식이라 동시 실행에 안전하지 않습니다.
concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-26  # Xcode 26 지원
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 26.4 선택
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Ruby 설정
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fastlane 설치
        run: bundle install

      # match 인증서 저장소(wongbingg/team-auth) 접근을 위한 SSH 키 설정
      # MATCH_SSH_PRIVATE_KEY: team-auth 레포 Deploy Key의 개인키
      - name: SSH 키 등록 (match 인증서 저장소용)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: SPM 패키지 사전 해결
        run: |
          cd NewsLetter
          xcodebuild -resolvePackageDependencies \
            -project NewsLetter.xcodeproj \
            -scheme NewsLetter \
            -disablePackageRepositoryCache

      - name: Fastlane 실행
        id: fastlane
        env:
          # match 인증서 암호화 패스프레이즈
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # App Store Connect API Key (Apple ID + 2FA 대신 사용)
          APP_STORE_CONNECT_API_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:   ${{ secrets.ASC_PRIVATE_KEY }}
          # 앱 빌드에 필요한 시크릿 (gitignore된 secret.xcconfig 재생성에 사용)
          SECRET_BASE_URL:    ${{ secrets.SECRET_BASE_URL }}
          SECRET_APP_KEY:     ${{ secrets.SECRET_APP_KEY }}
          SECRET_URL_SCHEMES: ${{ secrets.SECRET_URL_SCHEMES }}
          # Firebase 설정 (gitignore된 GoogleService-Info.plist 재생성에 사용)
          # 로컬에서 생성: base64 -i GoogleService-Info.plist | pbcopy
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          # TestFlight changelog에 표시할 빌드 출처 정보
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LANE="${{ github.event.inputs.lane }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            LANE="release"
          else
            LANE="beta"
          fi
          echo "Selected lane: $LANE"
          bundle exec fastlane $LANE

      # develop 빌드에만 태그를 답니다. release/* 는 수명이 짧고
      # 최종적으로 main에 v태그가 붙으므로 별도 추적이 불필요합니다.
      - name: 빌드 태그 생성
        if: github.ref_name == 'develop' && steps.fastlane.outputs.build_tag != ''
        run: |
          TAG="${{ steps.fastlane.outputs.build_tag }}"
          git tag "$TAG"
          git push origin "$TAG"
